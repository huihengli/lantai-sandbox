# 依赖安全审计 —— 定时运行，不阻塞 push。
# 与 ci.yml 分开的原因：上游新披露的漏洞随时可能出现，
# 把它放在 push 门禁里会让“昨天的绿色提交”今天突然变红，误导改动者。
name: 依赖安全审计

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 01:00 UTC（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python 依赖漏洞
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip-audit

      # requirements.txt 已精确锁定版本，audit 失败即为真实风险，需人工评估后升级。
      - name: 审计后端依赖
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off

  node-deps:
    name: 前端依赖漏洞
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（严格锁定 lockfile）
        run: pnpm install --frozen-lockfile

      - name: 审计前端运行时依赖
        run: pnpm audit --prod --audit-level high
